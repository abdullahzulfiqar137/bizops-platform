<nav class="breadcrumb-nav">
  <svg class="home-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="m3 11 9-8 9 8"/>
    <path d="M5 10v10h14V10"/>
    <path d="M9 20v-6h6v6"/>
  </svg>
  @for (crumb of breadcrumbs; track $index; let last = $last) {
    <a [routerLink]="crumb.url" class="crumb-link" [class.active]="last" [attr.aria-current]="last ? 'page' : null">{{ crumb.label }}</a>
    @if (!last) {
      <svg class="separator" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    }
  }
</nav>

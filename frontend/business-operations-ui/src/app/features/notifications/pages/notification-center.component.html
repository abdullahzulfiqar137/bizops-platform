<div class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Notifications</h1>
      <p class="page-subtitle">{{unread}} unread operational updates.</p>
    </div>
    <button class="btn-action" (click)="readAll()" [disabled]="!unread">Mark all as read</button>
  </header>

  <div class="tabs">
    <button [class.active]="filter==='all'" (click)="filter='all'">
      All <span>{{items.length}}</span>
    </button>
    <button [class.active]="filter==='unread'" (click)="filter='unread'">
      Unread <span>{{unread}}</span>
    </button>
  </div>

  <section class="enterprise-card list">
    @if (loading) {
      <div class="empty">Loading notifications...</div>
    }

    @for (n of visible; track n.id) {
      <button class="notice" [class.unread]="!n.isRead" (click)="read(n)">
        <span class="dot"></span>
        <span class="copy">
          <span class="notice-head">
            <strong>{{n.title}}</strong>
            <time>{{n.createdAtUtc | date:'short'}}</time>
          </span>
          <small>{{n.message}}</small>
        </span>
      </button>
    } @empty {
      @if (!loading) {
        <div class="empty">
          <strong>You're all caught up</strong>
          <span>No notifications in this view.</span>
        </div>
      }
    }
  </section>
</div>

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD}
    volumes:
      - sql-data:/var/opt/mssql
      - sql-backups:/var/opt/mssql/backups
    networks: [backend]

  api:
    build:
      context: ./backend/BusinessOperations.API
    restart: unless-stopped
    depends_on: [database]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: Server=database;Database=BusinessOperations;User Id=sa;Password=${DB_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      JwtSettings__SecretKey: ${JWT_SECRET:?Set JWT_SECRET}
      JwtSettings__Issuer: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
      JwtSettings__Audience: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL}
      JwtSettings__RequireHttpsMetadata: "true"
      AllowedOrigins__0: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL}
      Email__Host: ${SMTP_HOST:-}
      Email__Port: ${SMTP_PORT:-587}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Email__FrontendBaseUrl: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL}
      DatabaseBackups__Directory: /var/opt/business-operations/backups
    volumes:
      - api-backups:/var/opt/business-operations/backups
      - api-uploads:/app/wwwroot/uploads
    networks: [backend, frontend]

  web:
    build:
      context: ./frontend/business-operations-ui
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks: [frontend]

networks:
  backend:
    internal: true
  frontend:

volumes:
  sql-data:
  sql-backups:
  api-backups:
  api-uploads:

